name: Build EPN Trinity (Windows VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP test
        run: build\Release\TrinityDspTest.exe build
        shell: cmd

      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y -opluginval pluginval.zip > /dev/null
          set +e
          ./pluginval/pluginval.exe --strictness-level 5 --verbose \
            --validate "build/EPNTrinity_artefacts/Release/VST3/EPN Trinity.vst3" 2>&1 | tee pluginval.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # surface the interesting part as an annotation (readable without the log blob)
            msg=$(grep -nE "FAILED|!!!|Starting test|Error|error|Assert|Exception|Completed" pluginval.txt | tail -60)
            [ -z "$msg" ] && msg=$(tail -60 pluginval.txt)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=pluginval rc=$rc::$msg"
            exit "$rc"
          fi

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\EPNTrinity_artefacts\Release\VST3\EPN Trinity.vst3" dist\
          Copy-Item "build\EPNTrinity_artefacts\Release\Standalone\EPN Trinity.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath EPN-Trinity-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EPN-Trinity-Windows
          path: EPN-Trinity-Windows.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EPN-Trinity-Windows.zip
