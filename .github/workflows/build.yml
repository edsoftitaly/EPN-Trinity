name: Build EPN Trinity (Windows VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP test
        run: build\Release\TrinityDspTest.exe build
        shell: cmd

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs "build\EPNTrinity_artefacts\Release\VST3\EPN Trinity.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\EPNTrinity_artefacts\Release\VST3\EPN Trinity.vst3" dist\
          Copy-Item "build\EPNTrinity_artefacts\Release\Standalone\EPN Trinity.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath EPN-Trinity-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EPN-Trinity-Windows
          path: EPN-Trinity-Windows.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EPN-Trinity-Windows.zip
